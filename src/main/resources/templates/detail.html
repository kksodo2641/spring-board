<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>게시글 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 th:text="${post.title}"></h2>

    <div class="mb-3 text-muted">
        작성자: <span th:text="${post.writer}"></span> |
        조회수: <span th:text="${post.viewCount}"></span>
    </div>

    <div class="mb-5">
        <p th:text="${post.content}"></p>
    </div>

    <div class="mb-3">
        <a href="/posts" class="btn btn-secondary">목록</a>
        <a th:href="@{/posts/edit/{id}(id=${post.id})}" class="btn btn-warning">수정</a>
        <a th:href="@{/posts/delete/{id}(id=${post.id})}" class="btn btn-danger">삭제</a>
    </div>

</div>

</body>
</html>
